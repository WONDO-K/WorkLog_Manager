<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WORKLOG_COMPANY · 업무 기록</title>
<style>
:root{color-scheme:light;font:14px/1.6 'Segoe UI','Malgun Gothic',sans-serif;color:#172b4d;background:#f5f8ff}*{box-sizing:border-box}body{margin:0}header{background:white;padding:20px 28px;border-bottom:1px solid #dbe5f4;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}header strong{font-size:18px}button,input,textarea,select{font:inherit;color:inherit;border:1px solid #cdd9ec;border-radius:7px;padding:9px;background:white}button{cursor:pointer}button.primary,button.active{background:#2563eb;color:white;border-color:#2563eb}button:disabled{opacity:.6;cursor:wait}.shell{max-width:1400px;margin:auto;display:grid;grid-template-columns:330px minmax(0,1fr)}aside{padding:22px;border-right:1px solid #dbe5f4}main{padding:26px;background:white;min-height:85vh;min-width:0}input,textarea,select{width:100%}textarea{resize:vertical;min-height:85px}label{display:block;margin-bottom:15px}label span,.muted{color:#526581;font-size:12px}label span{display:block;margin-bottom:5px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.grid,.daily-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.task{display:block;width:100%;text-align:left;margin-top:10px;padding:14px;border-left:3px solid transparent}.task.active{border-left-color:#2563eb;background:#eaf2ff}.task strong{display:block;margin:5px 0;font-weight:500}.badge{font-size:12px;color:#1d4ed8;background:#eaf2ff;padding:3px 7px;border-radius:4px}h1{font-size:21px;font-weight:500;margin:0 0 18px}h2{font-size:16px;font-weight:500}.event{border-left:2px solid #dbe5f4;padding:0 0 18px 16px;white-space:pre-wrap;overflow-wrap:anywhere}.event p{margin:4px 0}#message{padding:12px 28px;background:#eaf2ff;white-space:pre-wrap}#message:empty{display:none}#message.error{color:#9b1c1c;background:#fff0f0}details{margin-top:5px}.changes{font-size:12px;color:#526581}.empty{padding:60px 10px;color:#526581}button:focus-visible{outline:3px solid #93c5fd}form button{margin:5px 0 20px}#dailyView{max-width:1400px;margin:auto;background:white;min-height:85vh;padding:26px}#dailyView textarea{min-height:500px;font-family:Consolas,'Malgun Gothic',monospace;font-size:13px}.review-check input{width:auto;margin-right:7px}[hidden]{display:none!important}@media(max-width:720px){.shell,.grid,.daily-grid{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #dbe5f4}main,#dailyView{padding:20px}input,textarea,select{font-size:16px}#dailyView textarea{min-height:320px}}
</style>
<header><strong>worklog_manager / WORKLOG_COMPANY</strong><div class="row"><button id="viewTasks" class="active">업무 현황</button><button id="viewDaily">일일 마감</button><button id="backup">DB 백업</button><button id="refresh">최신 기록 불러오기</button><button id="new" class="primary">+ 새 요청</button></div></header><div id="message" role="status" aria-live="polite"></div><div id="workView" class="shell"><aside><label><span>업무 검색</span><input id="search" placeholder="제목 · 요청 내용 검색"></label><label><span>상태</span><select id="filter"><option>전체</option><option>할 일</option><option>진행 중</option><option>완료</option><option>보류</option></select></label><div id="list"></div></aside><main id="detail"><div class="empty">업무를 불러오는 중입니다.</div></main></div><section id="dailyView" hidden><div class="row"><div><span class="muted">내부용과 외부용은 SQLite에 보관됩니다.</span><h1>일일 마감 · 외부용 검토</h1></div><div class="row"><label><span>업무 날짜</span><input id="workDate" type="date"></label><button id="loadDaily">기록 불러오기</button><span id="dailyStatus" class="badge">초안</span></div></div><form id="dailyForm"><div class="daily-grid"><label><span>내부용 업무 요약</span><textarea id="internalMd" maxlength="200000"></textarea></label><label><span>외부용 초안</span><textarea id="publicMd" maxlength="200000"></textarea></label></div><div class="row"><button id="saveDaily" class="primary">일일 요약 초안 저장</button><div><label class="review-check"><input id="reviewed" type="checkbox">공개 범위와 성과 표현을 검토했습니다</label><button id="confirmDaily" type="button">외부용 확정</button></div></div></form></section>
<script>
const $=id=>document.getElementById(id),states=['할 일','진행 중','완료','보류'];let tasks=[],current=null,dirty=false,dailyLog=null,dailyDirty=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={title:'요청 제목',request:'요청 배경 · 내용',criteria:'완료 기준',deadline:'고객 요청 납기',target_date:'내부 목표일',next_action:'다음 행동',status:'상태'};
function message(t,error=false){$('message').textContent=t;$('message').className=error?'error':'';}
async function api(path,method='GET',data){const r=await fetch('/api/tasks'+path,{method,headers:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});const value=await r.json();if(!r.ok)throw Error(value.error);return value;}
async function dailyApi(path,method='GET',data){const r=await fetch('/api/daily-logs/'+path,{method,headers:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});const value=await r.json();if(!r.ok)throw Error(value.error);return value;}
function canLeave(){return (!dirty&&!dailyDirty)||confirm('저장하지 않은 입력이 있습니다. 이동하면 입력을 잃습니다. 계속할까요?');}
function template(date,label){return `# ${date} WORKLOG_COMPANY 업무 로그 (${label})\n\n## 1. 핵심 성과 요약\n- 확인 필요\n\n## 2. 질문/문제 인식\n- 확인 필요\n\n## 3. 문제 해결 과정\n- 확인 필요\n\n## 4. 조치/판단 내용\n- 확인 필요\n\n## 5. 배운 개념/기술 학습 포인트\n- 확인 필요\n\n## 6. 개선 효과\n- 확인 필요\n\n## 7. 성능/효율 영향\n- 대화 내 근거 부족\n\n## 8. 수치화 후보\n- 확인 필요\n\n## 9. 이력서/성과 문장 후보\n- 확인 필요\n\n## 10. 추가 확인 질문\n- 확인 필요\n`;}
async function loadDaily(){try{dailyLog=await dailyApi($('workDate').value);$('internalMd').value=dailyLog.internal_md||template(dailyLog.work_date,'내부용');$('publicMd').value=dailyLog.public_md||template(dailyLog.work_date,'외부용 초안');$('dailyStatus').textContent=dailyLog.status;dailyDirty=false;$('reviewed').checked=false;message('일일 기록을 불러왔습니다.');}catch(e){message(e.message,true);}}
function showView(daily){if(!canLeave())return;dirty=false;dailyDirty=false;$('workView').hidden=daily;$('dailyView').hidden=!daily;$('viewTasks').classList.toggle('active',!daily);$('viewDaily').classList.toggle('active',daily);$('new').hidden=daily;$('refresh').hidden=daily;message('');if(daily)loadDaily();}
function list(){const query=$('search').value.toLowerCase(),state=$('filter').value;const visible=tasks.filter(t=>(state==='전체'||t.status===state)&&(t.title+' '+t.request).toLowerCase().includes(query));$('list').innerHTML=visible.map(t=>`<button class="task ${current?.id===t.id?'active':''}" data-id="${t.id}"><span class="badge">${t.status}</span><strong>${esc(t.title)}</strong><span class="muted">${t.deadline?'고객 납기 '+esc(t.deadline):'납기 미지정'}</span></button>`).join('')||'<p class="muted">표시할 업무가 없습니다.</p>';}
function field(key,type='text'){return `<label><span>${labels[key]}</span>${type==='textarea'?`<textarea name="${key}" ${key==='request'?'required':''}>${esc(current?.[key])}</textarea>`:`<input name="${key}" type="${type}" value="${esc(current?.[key])}" ${key==='title'?'required maxlength="200"':''}>`}</label>`;}
function form(){const existing=!!current?.id;$('detail').innerHTML=`<h1>${existing?esc(current.title):'새 요청 등록'}</h1><form id="edit">${field('title')}${field('request','textarea')}${field('criteria','textarea')}<div class="grid">${field('deadline','date')}${field('target_date','date')}</div>${field('next_action')} ${existing?`<label><span>상태</span><select name="status">${states.map(s=>`<option ${current.status===s?'selected':''}>${s}</option>`).join('')}</select></label><label><span>진행 기록 · 완료 시 검증 근거 / 보류 시 사유</span><textarea name="note" placeholder="확인한 원인, 수정 사항, 검증 결과를 입력하세요."></textarea></label>`:''}<button class="primary" id="save">${existing?'변경 · 이력 저장':'요청 등록'}</button></form>${existing?'<h2>작업 이력</h2>'+current.events.map(e=>`<section class="event"><span class="muted">${new Date(e.created_at).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})}</span><p>${esc(e.note)}</p><details><summary class="muted">변경 내용</summary><div class="changes">${Object.entries(JSON.parse(e.changes)).map(([k,v])=>`${esc(labels[k]||k)}: ${esc(typeof v==='object'?v.before+' → '+v.after:v)}`).join('<br>')||'진행 기록 추가'}</div></details></section>`).join(''):''}`;$('edit').oninput=()=>dirty=true;$('edit').onsubmit=save;}
async function load(id){current=await api('/'+id);dirty=false;form();list();}
async function save(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(current)data.version=current.version;$('save').disabled=true;try{const saved=await api(current?'/'+current.id:'',current?'PATCH':'POST',data);current=saved;dirty=false;form();tasks=await api('');list();message('기록 반영: '+saved.status+' · SQLite 저장 완료');}catch(err){message(err.message,true);}finally{if($('save'))$('save').disabled=false;}}
$('list').onclick=async e=>{const b=e.target.closest('[data-id]');if(b&&canLeave())try{await load(b.dataset.id);message('');}catch(err){message(err.message,true)}};
$('new').onclick=()=>{if(canLeave()){current=null;dirty=false;form();list();message('')}};$('search').oninput=list;$('filter').onchange=list;
$('refresh').onclick=async()=>{if(!canLeave())return;try{tasks=await api('');if(current)await load(current.id);else{dirty=false;form();list()}message('최신 기록을 불러왔습니다.');}catch(err){message(err.message,true)}};
$('viewTasks').onclick=()=>showView(false);$('viewDaily').onclick=()=>showView(true);
$('workDate').value=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date());
$('workDate').onchange=()=>{const previous=dailyLog?.work_date;if(!canLeave()){return $('workDate').value=previous??$('workDate').value;}dailyDirty=false;loadDaily();};
$('loadDaily').onclick=()=>{if(canLeave())loadDaily();};
$('dailyForm').oninput=e=>{if(e.target.id!=='reviewed'){dailyDirty=true;$('reviewed').checked=false;$('dailyStatus').textContent='수정됨 · 초안 저장 필요';}};
$('dailyForm').onsubmit=async e=>{e.preventDefault();$('saveDaily').disabled=true;try{dailyLog=await dailyApi($('workDate').value,'PUT',{version:dailyLog?.work_date===$('workDate').value?dailyLog.version:0,internal_md:$('internalMd').value,public_md:$('publicMd').value});dailyDirty=false;$('dailyStatus').textContent=dailyLog.status;message('일일 요약 초안을 SQLite에 저장했습니다.');}catch(err){message(err.message,true);}finally{$('saveDaily').disabled=false;}};
$('confirmDaily').onclick=async()=>{if(dailyDirty){message('수정한 초안을 먼저 저장하세요.',true);return;}if(!$('reviewed').checked){message('공개 범위와 성과 표현을 검토한 뒤 확인란을 선택하세요.',true);return;}try{dailyLog=await dailyApi($('workDate').value+'/confirm','POST',{version:dailyLog?.version??0});$('dailyStatus').textContent=dailyLog.status;message('외부용 기록을 확정했습니다. Markdown 파일 생성과 Git 커밋은 아직 실행하지 않습니다.');}catch(err){message(err.message,true);}};
window.addEventListener('beforeunload',e=>{if(dirty||dailyDirty){e.preventDefault();e.returnValue='';}});
$('backup').onclick=async()=>{if(dirty||dailyDirty){message('입력한 변경 내용을 먼저 저장한 뒤 백업하세요.',true);return;}$('backup').disabled=true;try{const r=await fetch('/api/backup',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const result=await r.json();if(!r.ok)throw Error(result.error);message(result.warning||'DB 백업 완료 · 무결성 검증 완료 · 최근 30개 보관');}catch(e){message(e.message,true);}finally{$('backup').disabled=false;}};
(async()=>{try{tasks=await api('');if(tasks.length)await load(tasks[0].id);else{form();list()}}catch(err){message(err.message,true);$('detail').textContent='서버 연결을 확인한 뒤 최신 기록을 불러오세요.'}})();
</script></html>
